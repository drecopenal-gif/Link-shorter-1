<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Shortener & Monetization System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #fff;
            padding: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar {
            width: 100%;
            height: 100%;
            background-color: #4CAF50;
            transition: width linear;
        }
        .ad-box {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 20px;
        }
        .btn {
            background-color: #007BFF;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            text-decoration: none;
            display: none;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .short-result {
            margin-top: 15px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Dynamic Content will load here -->
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const linkId = urlParams.get('id');

    function saveShortLink(originalUrl) {
        const rand = Math.random().toString(36).substring(2, 8);
        const code = rand + Date.now().toString(36).substring(0, 2);
        const links = JSON.parse(localStorage.getItem('short_links') || '{}');
        links[code] = originalUrl;
        localStorage.setItem('short_links', JSON.stringify(links));
        return code;
    }

    function getOriginalUrl(code) {
        const links = JSON.parse(localStorage.getItem('short_links') || '{}');
        return links[code] || 'https://google.com';
    }

    function getUserBehavior() {
        let behavior = sessionStorage.getItem('user_behavior');
        let requiredClicks = sessionStorage.getItem('req_clicks');

        if (!behavior) {
            const rand = Math.random() * 100;
            if (rand < 90) {
                behavior = 'free';
                requiredClicks = 0;
            } else if (rand < 94) {
                behavior = 'two_clicks';
                requiredClicks = 2;
            } else {
                behavior = 'one_click';
                requiredClicks = 1;
            }
            sessionStorage.setItem('user_behavior', behavior);
            sessionStorage.setItem('req_clicks', requiredClicks);
            sessionStorage.setItem('completed_clicks', 0);
        }
        return parseInt(sessionStorage.getItem('req_clicks') || '0', 10);
    }

    let currentStep = parseInt(sessionStorage.getItem('current_step') || '1', 10);
    getUserBehavior();

    function renderPage() {
        const app = document.getElementById('app');

        if (!linkId) {
            app.innerHTML = `
                <h2>Admin Link Generator</h2>
                <p>Enter your main link below to create a short link:</p>
                <input type="text" id="targetUrl" placeholder="https://example.com/your-file">
                <br>
                <button class="btn" style="display:inline-block;" onclick="generateLink()">Create Short Link</button>
                <div class="short-result" id="resultBox">
                    <p><b>Your Short Link:</b></p>
                    <input type="text" id="generatedLinkOutput" readonly style="background:#fff; width:90%;">
                </div>
            `;
            return;
        }

        sessionStorage.setItem('current_step', currentStep);

        if (currentStep === 1) {
            app.innerHTML = `
                <div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="transition-duration: 6s;"></div></div>
                <h2>Step 1 of 3</h2>
                <p>Please wait while we process your request...</p>
                <div class="ad-box" id="ad300"></div>
                <div class="ad-box" id="ad728"></div>
                <p class="error-msg" id="errMsg">Please click on the advertisement to proceed!</p>
                <button class="btn" id="nextBtn" onclick="proceedNext(2)">Continue</button>
            `;
            startTimer(6, () => checkClicksAndEnableButton(2));
            loadAds();
        } else if (currentStep === 2) {
            app.innerHTML = `
                <div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="transition-duration: 4s;"></div></div>
                <h2>Step 2 of 3</h2>
                <p>Almost there, getting things ready...</p>
                <div class="ad-box" id="ad300"></div>
                <div class="ad-box" id="ad728"></div>
                <p class="error-msg" id="errMsg">Please click on the advertisement to proceed!</p>
                <button class="btn" id="nextBtn" onclick="proceedNext(3)">Continue</button>
            `;
            startTimer(4, () => checkClicksAndEnableButton(3));
            loadAds();
        } else if (currentStep === 3) {
            app.innerHTML = `
                <div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="transition-duration: 3s;"></div></div>
                <h2>Final Step</h2>
                <p>Click below to unlock your destination link.</p>
                <div class="ad-box" id="ad300"></div>
                <div class="ad-box" id="ad728"></div>
                <p class="error-msg" id="errMsg">Please click on the advertisement to unlock!</p>
                <button class="btn" id="nextBtn" onclick="finalAction()">Get Access</button>
            `;
            startTimer(3, () => {
                const req = parseInt(sessionStorage.getItem('req_clicks') || '0', 10);
                const completed = parseInt(sessionStorage.getItem('completed_clicks') || '0', 10);
                if (completed >= req) {
                    document.getElementById('nextBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('errMsg').style.display = 'block';
                }
            });
            loadAds();
        }
    }

    function generateLink() {
        const input = document.getElementById('targetUrl');
        const val = input ? input.value.trim() : '';
        if (!val) {
            alert('Please enter a valid URL!');
            return;
        }
        const code = saveShortLink(val);
        const shortLink = window.location.origin + window.location.pathname + '?id=' + code;
        document.getElementById('generatedLinkOutput').value = shortLink;
        document.getElementById('resultBox').style.display = 'block';
    }

    function startTimer(seconds, callback) {
        const bar = document.getElementById('progressBar');
        if (bar) bar.style.width = '100%';
        setTimeout(() => {
            const barAfter = document.getElementById('progressBar');
            if (barAfter) barAfter.style.width = '0%';
        }, 50);
        setTimeout(callback, seconds * 1000);
    }

    function loadAds() {
        const ad300Container = document.getElementById('ad300');
        const ad728Container = document.getElementById('ad728');

        if (ad300Container) {
            ad300Container.innerHTML = '<div style="width:300px;height:250px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border:1px dashed #bbb;">Ad Space 300x250</div>';
        }
        if (ad728Container) {
            ad728Container.innerHTML = '<div style="width:728px;height:90px;max-width:100%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border:1px dashed #bbb;">Ad Space 728x90</div>';
        }

        setupAdClickTracking();
    }

    function setupAdClickTracking() {
        setTimeout(() => {
            const adBoxes = document.querySelectorAll('.ad-box');
            adBoxes.forEach(box => {
                box.addEventListener('click', () => {
                    const completed = parseInt(sessionStorage.getItem('completed_clicks') || '0', 10);
                    sessionStorage.setItem('completed_clicks', String(completed + 1));
                });
            });
        }, 100);
    }

    function checkClicksAndEnableButton(nextStepVal) {
        const req = parseInt(sessionStorage.getItem('req_clicks') || '0', 10);
        const completed = parseInt(sessionStorage.getItem('completed_clicks') || '0', 10);

        if (completed >= req) {
            currentStep = nextStepVal;
            renderPage();
        } else {
            const err = document.getElementById('errMsg');
            const btn = document.getElementById('nextBtn');
            if (err) err.style.display = 'block';
            if (btn) btn.style.display = 'inline-block';
        }
    }

    function proceedNext(nextStepVal) {
        const req = parseInt(sessionStorage.getItem('req_clicks') || '0', 10);
        const completed = parseInt(sessionStorage.getItem('completed_clicks') || '0', 10);

        if (completed >= req) {
            currentStep = nextStepVal;
            renderPage();
        } else {
            const err = document.getElementById('errMsg');
            if (err) err.style.display = 'block';
        }
    }

    function finalAction() {
        const req = parseInt(sessionStorage.getItem('req_clicks') || '0', 10);
        const completed = parseInt(sessionStorage.getItem('completed_clicks') || '0', 10);

        if (completed < req) {
            const err = document.getElementById('errMsg');
            if (err) err.style.display = 'block';
            return;
        }

        const smartlinkTriggered = sessionStorage.getItem('smartlink_done');
        const shouldOpenSmartlink = Math.random() < 0.35;

        if (shouldOpenSmartlink && !smartlinkTriggered) {
            sessionStorage.setItem('smartlink_done', 'true');
            window.location.href = "https://www.effectivecpmnetwork.com/v390gi5k?key=a634a3f6a0067c14cb621dc5e47b5aec";
        } else {
            window.location.href = getOriginalUrl(linkId);
        }
    }

    window.onload = function() {
        renderPage();
    };
</script>

</body>
</html>
